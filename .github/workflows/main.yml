name: Fast & Optimized Android Cloud (Real VNC)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fast System Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            adb curl tar openssl unzip \
            xvfb x11vnc \
            libpulse0 pulseaudio alsa-utils \
            libgl1 libglu1-mesa \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-image0 libxcb-shape0 libxcb-render-util0 \
            libxcb-icccm4 libxcb-keysyms1 \
            libnss3 libxcomposite1 libxi6 libxtst6 \
            imagemagick

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Generate Random Fresh Identity
        run: |
          echo "GENERATED_IMEI=$(shuf -i 860000000000000-869999999999999 -n 1)" >> $GITHUB_ENV
          echo "GENERATED_MAC=$(openssl rand -hex 6 | sed 's/\(..\)/\1:/g; s/.$//')" >> $GITHUB_ENV
          echo "GENERATED_SERIAL=$(openssl rand -hex 6 | tr 'a-z' 'A-Z')" >> $GITHUB_ENV
          echo "GENERATED_ANDROID_ID=$(openssl rand -hex 8)" >> $GITHUB_ENV

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Setup Android SDK & Emulator
        uses: android-actions/setup-android@v3

      - name: Install Emulator + System Image
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_AVD_HOME"

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64"

          # IMPORTANT: no --path here. When --path is passed explicitly,
          # avdmanager creates the phone.avd/config.ini folder but skips
          # writing the phone.ini *pointer* file in ANDROID_AVD_HOME, which
          # is the file the emulator actually uses to resolve an AVD name.
          # Letting it use the default (ANDROID_AVD_HOME) location creates
          # both files correctly.
          echo "no" | avdmanager create avd \
            -n phone -k "system-images;android-30;google_apis;x86_64" \
            --device "pixel_5" -f

          echo "--- Verifying AVD was actually created ---"
          avdmanager list avd

          if [ ! -f "$ANDROID_AVD_HOME/phone.ini" ]; then
            echo "::error::phone.ini pointer file was not created in $ANDROID_AVD_HOME — see avdmanager output above"
            ls -al "$ANDROID_AVD_HOME"
            exit 1
          fi
          if [ ! -f "$ANDROID_AVD_HOME/phone.avd/config.ini" ]; then
            echo "::error::AVD config.ini missing under $ANDROID_AVD_HOME/phone.avd"
            exit 1
          fi

          # By default the emulator ignores the host's physical keyboard and
          # only accepts the on-screen soft keyboard. This forwards real
          # key presses (including through VNC) into the guest.
          CONFIG_INI="$ANDROID_AVD_HOME/phone.avd/config.ini"
          sed -i '/^hw.keyboard=/d' "$CONFIG_INI"
          echo "hw.keyboard=yes" >> "$CONFIG_INI"
          sed -i '/^hw.keyboard.lid=/d' "$CONFIG_INI"
          echo "hw.keyboard.lid=false" >> "$CONFIG_INI"

          echo "AVD confirmed:"
          cat "$ANDROID_AVD_HOME/phone.ini"

      - name: Start Virtual Display
        run: |
          Xvfb :1 -screen 0 1280x800x24 &
          echo "DISPLAY=:1" >> $GITHUB_ENV
          sleep 2

      - name: Boot Emulator (on virtual display, KVM-accelerated)
        run: |
          export DISPLAY=:1
          nohup $ANDROID_HOME/emulator/emulator -avd phone \
            -no-audio -no-boot-anim -accel on -gpu swiftshader_indirect \
            > emulator.log 2>&1 &
          echo "Emulator launched, waiting for adb device..."

      - name: Wait For Full System Boot & Inject Identity
        run: |
          adb kill-server
          adb start-server

          echo "Waiting for emulator to register with adb..."
          timeout 90 adb wait-for-device || {
            echo "::error::adb never saw the emulator device (it likely crashed on launch)"
            echo "--- emulator.log ---"
            cat emulator.log
            echo "--- adb devices ---"
            adb devices -l
            exit 1
          }

          echo "adb sees the device. Checking process is actually alive..."
          adb devices -l
          if ! pgrep -f "emulator64-x86_64|qemu-system" > /dev/null; then
            echo "::error::Emulator process is not running anymore"
            cat emulator.log
            exit 1
          fi

          echo "Waiting for Android Package Manager service..."
          timeout=300
          elapsed=0
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            sleep 5
            elapsed=$((elapsed + 5))
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "::error::Android did not finish booting within ${timeout}s"
              cat emulator.log
              exit 1
            fi
          done
          echo "Android System Ready!"

          adb shell settings put secure android_id ${{ env.GENERATED_ANDROID_ID }}

      - name: Debug — Screenshot the Virtual Display
        run: |
          export DISPLAY=:1
          sleep 5
          import -display :1 -window root /tmp/xvfb-debug.png || echo "screenshot failed"

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xvfb-debug
          path: /tmp/xvfb-debug.png
          if-no-files-found: warn

      - name: Install Brave Browser
        continue-on-error: true
        run: |
          mkdir -p /tmp/apks && cd /tmp/apks
          set -e

          # "latest/download/<asset>" redirects straight to the newest
          # release's asset — no GitHub API call involved, so it never
          # hits API rate limits (which was causing the empty asset list).
          DIRECT_URL="https://github.com/brave/brave-browser/releases/latest/download/BraveMonox64.apk"

          echo "Trying direct download: $DIRECT_URL"
          if curl -sSL -f -o brave.apk "$DIRECT_URL"; then
            echo "Downloaded via direct latest/download link"
          else
            echo "Direct link failed, falling back to GitHub API lookup..."
            RELEASE_JSON=$(curl -sSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/brave/brave-browser/releases/latest")

            APK_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          for asset in assets:
              if asset.get('name') == 'BraveMonox64.apk':
                  print(asset.get('browser_download_url'))
                  break
          ")

            if [ -z "$APK_URL" ]; then
              echo "::warning::Could not download Brave Browser (direct link and API both failed) — continuing without it, VNC will still start"
              exit 0
            fi

            echo "Downloading: $APK_URL"
            curl -sSL -f -o brave.apk "$APK_URL" || {
              echo "::warning::Brave APK download failed — continuing without it, VNC will still start"
              exit 0
            }
          fi

          echo "Installing Brave..."
          adb install -r -g brave.apk || echo "::warning::Brave install failed — continuing anyway"

      - name: Start Real VNC Server (password protected, keyboard-fixed)
        run: |
          mkdir -p ~/.vnc
          x11vnc -storepasswd "${{ secrets.VNC_PASSWORD }}" ~/.vnc/passwd

          # -xkb + -noxrecord + -repeat fixes external/physical keyboard
          # input not registering through certain VNC clients.
          # -nocursorshape + -ncache 0 + low color depth cuts bandwidth,
          # which reduces perceived lag over the ngrok tunnel.
          cat > ~/start_vnc.sh << 'EOF'
          #!/bin/bash
          while true; do
            x11vnc -display :1 -forever -shared \
              -rfbauth ~/.vnc/passwd -rfbport 5900 \
              -xkb -noxrecord -noxfixes -noxdamage -repeat \
              -nocursorshape -nomodtweak \
              > x11vnc.log 2>&1
            echo "$(date): x11vnc exited, restarting in 3s..." >> x11vnc.log
            sleep 3
          done
          EOF
          chmod +x ~/start_vnc.sh
          nohup ~/start_vnc.sh > x11vnc_supervisor.log 2>&1 &

          sleep 3
          if ! pgrep -f "x11vnc" > /dev/null; then
            echo "::error::x11vnc failed to start"
            cat x11vnc.log
            exit 1
          fi
          echo "x11vnc running on port 5900 (auto-restart enabled)"

      - name: Start Ngrok TCP Tunnel (auto-restart) & Show Connect Info
        run: |
          # Watchdog wrapper so ngrok reconnects automatically if the
          # free-tier tunnel drops after ~20-30 min of idle/network hiccups.
          cat > ~/start_ngrok.sh << 'EOF'
          #!/bin/bash
          while true; do
            ngrok tcp 5900 --log=stdout >> ngrok_tcp.log 2>&1
            echo "$(date): ngrok exited, restarting in 3s..." >> ngrok_tcp.log
            sleep 3
          done
          EOF
          chmod +x ~/start_ngrok.sh
          nohup ~/start_ngrok.sh > ngrok_supervisor.log 2>&1 &

          TCP_TUNNEL=""
          for i in $(seq 1 15); do
            TCP_TUNNEL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "
          import json,sys
          try:
              data = json.load(sys.stdin)
              for t in data.get('tunnels', []):
                  if t.get('proto') == 'tcp':
                      print(t.get('public_url'))
          except Exception:
              pass
          ")
            if [ -n "$TCP_TUNNEL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TCP_TUNNEL" ]; then
            echo "::error::Ngrok TCP tunnel never became available"
            cat ngrok_tcp.log
            exit 1
          fi

          # TCP_TUNNEL looks like: tcp://0.tcp.ngrok.io:12345
          HOST_PORT=$(echo "$TCP_TUNNEL" | sed 's#tcp://##')
          HOST=$(echo "$HOST_PORT" | cut -d: -f1)
          PORT=$(echo "$HOST_PORT" | cut -d: -f2)

          echo "# 🚀 REAL VNC CONNECT INFO" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Host:** \`$HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Port:** \`$PORT\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Full Address:** \`$HOST_PORT\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password:** stored in the \`VNC_PASSWORD\` secret" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 How to connect" >> $GITHUB_STEP_SUMMARY
          echo "1. Install a VNC client app (e.g. **RealVNC Viewer** or **bVNC**)." >> $GITHUB_STEP_SUMMARY
          echo "2. Add a new connection using the Host and Port above." >> $GITHUB_STEP_SUMMARY
          echo "3. Enter the password from your \`VNC_PASSWORD\` secret when prompted." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🆔 Fresh Identity Applied:" >> $GITHUB_STEP_SUMMARY
          echo "- **IMEI:** \`${{ env.GENERATED_IMEI }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MAC Address:** \`${{ env.GENERATED_MAC }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Serial:** \`${{ env.GENERATED_SERIAL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Android ID:** \`${{ env.GENERATED_ANDROID_ID }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Keep Alive & Re-announce Tunnel If It Changes
        run: |
          LAST_URL=""
          while true; do
            sleep 60
            CURRENT_URL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "
          import json,sys
          try:
              data = json.load(sys.stdin)
              for t in data.get('tunnels', []):
                  if t.get('proto') == 'tcp':
                      print(t.get('public_url'))
          except Exception:
              pass
          " 2>/dev/null)

            if [ -n "$CURRENT_URL" ] && [ "$CURRENT_URL" != "$LAST_URL" ]; then
              HOST_PORT=$(echo "$CURRENT_URL" | sed 's#tcp://##')
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "🔄 **Tunnel reconnected — new address:** \`$HOST_PORT\`" >> $GITHUB_STEP_SUMMARY
              LAST_URL="$CURRENT_URL"
            fi
          done
