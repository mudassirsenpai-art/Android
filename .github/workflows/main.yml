name: Optimized Android Cloud Gaming Phone

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kernel Modules & ADB
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb curl tar jq
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      - name: Run Gaming-Optimized Redroid Container (with GApps)
        run: |
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            cakriwut/redroid:11.0.0_gapps_magisk \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=320 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest \
            ro.setupwizard.mode=DISABLED

      - name: Wait For Redroid To Boot
        run: |
          echo "Waiting for redroid container to fully boot..."
          sleep 20
          docker logs redroid --tail 50 || true

      - name: Connect ADB
        run: |
          adb kill-server
          adb start-server
          adb connect 127.0.0.1:5555
          adb -s 127.0.0.1:5555 wait-for-device
          adb -s 127.0.0.1:5555 shell settings put global policy_control null
          echo "ADB connected to redroid."

      - name: Install & Start droidVNC-NG (headless remote desktop)
        run: |
          LATEST_APK_URL=$(curl -s https://api.github.com/repos/bk138/droidVNC-NG/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')

          curl -sL -o droidvncng.apk "$LATEST_APK_URL"
          adb -s 127.0.0.1:5555 install -r droidvncng.apk

          # Grant permission to capture screen without a popup every boot
          adb -s 127.0.0.1:5555 shell cmd appops set net.christianbeier.droidvnc_ng PROJECT_MEDIA allow

          # Enable input/touch injection accessibility service
          CURRENT_SERVICES=$(adb -s 127.0.0.1:5555 shell settings get secure enabled_accessibility_services)
          adb -s 127.0.0.1:5555 shell settings put secure enabled_accessibility_services \
            "net.christianbeier.droidvnc_ng/.InputService:${CURRENT_SERVICES}"

          # Start the VNC server on port 5901
          adb -s 127.0.0.1:5555 shell am start-foreground-service \
            -n net.christianbeier.droidvnc_ng/.MainService \
            -a net.christianbeier.droidvnc_ng.ACTION_START \
            --ei net.christianbeier.droidvnc_ng.EXTRA_PORT 5901

          sleep 5
          echo "VNC server started on port 5901 inside redroid."

      - name: Start Ngrok Tunnels (ADB + VNC)
        run: |
          ngrok tcp 5555 --log=stdout > ngrok_adb.log &
          ngrok tcp 5901 --log=stdout > ngrok_vnc.log &

          echo "Waiting for ngrok tunnels to come online..."
          for i in $(seq 1 15); do
            TUNNEL_COUNT=$(curl -s http://localhost:4040/api/tunnels | jq '.tunnels | length' 2>/dev/null || echo 0)
            if [ "$TUNNEL_COUNT" -ge "2" ]; then
              echo "Both tunnels are up."
              break
            fi
            echo "Tunnels not ready yet ($TUNNEL_COUNT/2), retrying..."
            sleep 3
          done

      - name: Print Connection Info
        run: |
          echo "============================================================"
          echo "        GAMING ANDROID CLOUD - READY TO CONNECT              "
          echo "============================================================"
          echo ""
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | "\(.config.addr) -> \(.public_url)"' | while read -r line; do
            case "$line" in
              *:5555*)
                echo "ADB TUNNEL (PC/laptop, scrcpy):   ${line##*-> }"
                ;;
              *:5901*)
                echo "VNC TUNNEL (Phone, RDP-style):    ${line##*-> }"
                ;;
            esac
          done
          echo ""
          echo "OPTION 1 (Phone, RDP-style, no PC needed):"
          echo "  1. Install any VNC Viewer app from Play Store (e.g. 'VNC Viewer' by RealVNC)"
          echo "  2. Paste the VNC TUNNEL address above (strip tcp:// prefix, keep host:port)"
          echo "  3. Connect - full touch control, native window, no browser"
          echo ""
          echo "OPTION 2 (PC/laptop, best quality):"
          echo "  adb connect <ADB TUNNEL host:port>"
          echo "  scrcpy -s <host>:<port> --max-fps=60 --video-bit-rate=8M"
          echo "============================================================"
          echo "NOTE: ngrok free tier addresses change every run - always copy fresh."
          echo "============================================================"

      - name: Keep Tunnel Active
        run: |
          while true; do sleep 300; done
