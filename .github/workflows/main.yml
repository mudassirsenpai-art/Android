name: Android Cloud with GApps + VNC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb curl tar wget
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Run Redroid With GApps (Play Store + Chrome)
        run: |
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            aureliolo/redroid:14.0.0_amd64_with_gapps \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=1920 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=420 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest \
            ro.setupwizard.mode=DISABLED

      - name: Connect ADB & Wait For Boot
        run: |
          adb kill-server
          adb start-server

          for i in $(seq 1 30); do
            if adb connect 127.0.0.1:5555 2>&1 | grep -q "connected"; then
              break
            fi
            sleep 1
          done

          adb -s 127.0.0.1:5555 wait-for-device

          for i in $(seq 1 60); do
            BOOT_COMPLETED=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Boot completed after ~${i}s."
              break
            fi
            sleep 1
          done

          adb -s 127.0.0.1:5555 shell settings put global policy_control null

      - name: Install & Start VNC Server (droidVNC-NG)
        run: |
          PKG="net.christianbeier.droidvnc_ng"

          cat > /tmp/find_apk.py << 'PYEOF'
          import json, sys
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          url = None
          for a in assets:
              name = a.get('name', '')
              if name.endswith('.apk') and ('x86_64' in name or 'universal' in name):
                  url = a['browser_download_url']
                  break
          if url is None:
              for a in assets:
                  if a.get('name', '').endswith('.apk'):
                      url = a['browser_download_url']
                      break
          if url:
              print(url)
          PYEOF

          ASSET_URL=$(curl -s https://api.github.com/repos/bk138/droidVNC-NG/releases/latest | python3 /tmp/find_apk.py)

          echo "APK URL: $ASSET_URL"
          wget -q "$ASSET_URL" -O droidvncng.apk
          adb -s 127.0.0.1:5555 install -r droidvncng.apk

          adb -s 127.0.0.1:5555 shell appops set $PKG SYSTEM_ALERT_WINDOW allow || true
          adb -s 127.0.0.1:5555 shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true

          # Launch the app's main activity - the app can auto-start serving
          adb -s 127.0.0.1:5555 shell am start -n $PKG/.MainActivity
          sleep 3

          # Trigger server start via the app's public intent interface (MainService is the real component name)
          adb -s 127.0.0.1:5555 shell am start-foreground-service \
            -a $PKG.ACTION_START \
            $PKG/net.christianbeier.droidvnc_ng.MainService || \
          adb -s 127.0.0.1:5555 shell am startservice \
            -a $PKG.ACTION_START \
            $PKG/net.christianbeier.droidvnc_ng.MainService || true

          adb -s 127.0.0.1:5555 forward tcp:5900 tcp:5900

          echo "droidVNC-NG installed and started. Port 5900 forwarded."

      - name: Start Ngrok Tunnel & Print Connection Info
        run: |
          ngrok tcp 5900 --log=stdout > ngrok_vnc.log &

          cat > /tmp/count_tunnels.py << 'PYEOF'
          import json, sys
          try:
              data = json.load(sys.stdin)
              print(len(data.get('tunnels', [])))
          except Exception:
              print(0)
          PYEOF

          cat > /tmp/get_vnc_url.py << 'PYEOF'
          import json, sys
          data = json.load(sys.stdin)
          for t in data.get('tunnels', []):
              if t.get('proto') == 'tcp':
                  print(t.get('public_url'))
          PYEOF

          for i in $(seq 1 15); do
            TUNNEL_COUNT=$(curl -s http://localhost:4040/api/tunnels | python3 /tmp/count_tunnels.py 2>/dev/null || echo 0)
            if [ "$TUNNEL_COUNT" -ge "1" ]; then
              break
            fi
            sleep 2
          done

          VNC_TUNNEL=$(curl -s http://localhost:4040/api/tunnels | python3 /tmp/get_vnc_url.py)

          echo "============================================================"
          echo "       ANDROID CLOUD (GAPPS + CHROME + PLAY STORE)          "
          echo "                  READY - CONNECT VIA VNC                   "
          echo "============================================================"
          echo ""
          echo " 1. Install 'VNC Viewer' (RealVNC) from Play Store"
          echo " 2. Add new connection using: $VNC_TUNNEL"
          echo "    (strip tcp:// prefix, use host:port only)"
          echo " 3. Connect - no password set by default."
          echo ""
          echo "============================================================"

      - name: Keep Session Active
        run: |
          while true; do sleep 300; done
