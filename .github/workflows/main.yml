name: Android OS Remote Access (Fast Boot)

on:
  workflow_dispatch:

jobs:
  run-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo adduser $USER kvm
          sudo chown $USER /dev/kvm

      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN

      - name: Launch Android OS (Fast Boot Mode)
        run: |
          docker run -d \
            --privileged \
            --name android-container \
            -p 5900:5900 \
            -p 6080:6080 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e WEB_VNC=true \
            -e VNC_USER="AdminMudasir" \
            -e VNC_PASSWORD="MuDaSiT#786$99" \
            -e APPIUM=false \
            -e DEVICE_CONNECT=true \
            --device /dev/kvm \
            budtmo/docker-android-x86-11.0

      - name: Ultra-Fast Setup & UI Optimization
        run: |
          echo "Quick boot setup running..."
          sleep 35
          # Speed up UI & enable 3-Button Nav
          docker exec android-container adb shell settings put global window_animation_scale 0.0 || true
          docker exec android-container adb shell settings put global transition_animation_scale 0.0 || true
          docker exec android-container adb shell settings put global animator_duration_scale 0.0 || true
          docker exec android-container adb shell settings put global policy_control null || true
          docker exec android-container adb shell qemu.hw.mainkeys 0 || true

      - name: Start Ngrok TCP Tunnel
        run: |
          echo "Ngrok TCP Tunneling..."
          ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 3
          echo "=========================================================="
          echo "YOUR FAST-CONNECT VNC ENDPOINT:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
          echo "Username: AdminMudasir"
          echo "Password: MuDaSiT#786$99"
          echo "=========================================================="

      - name: Keep Workflow Alive
        run: |
          sleep 216000
