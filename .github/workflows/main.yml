name: Optimized Android Cloud Phone

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kernel Modules & ADB
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb curl tar openssl
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

      - name: Generate Random Fresh Identity (Full New Piece)
        run: |
          RANDOM_IMEI=$(shuf -i 860000000000000-869999999999999 -n 1)
          RANDOM_MAC=$(openssl rand -hex 6 | sed 's/\(..\)/\1:/g; s/.$//')
          RANDOM_SERIAL=$(openssl rand -hex 6 | tr 'a-z' 'A-Z')
          RANDOM_ANDROID_ID=$(openssl rand -hex 8)

          echo "GENERATED_IMEI=$RANDOM_IMEI" >> $GITHUB_ENV
          echo "GENERATED_MAC=$RANDOM_MAC" >> $GITHUB_ENV
          echo "GENERATED_SERIAL=$RANDOM_SERIAL" >> $GITHUB_ENV
          echo "GENERATED_ANDROID_ID=$RANDOM_ANDROID_ID" >> $GITHUB_ENV

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN

      - name: Run Gaming & Smooth Optimized Redroid
        run: |
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=540 \
            androidboot.redroid_height=960 \
            androidboot.redroid_fps=30 \
            androidboot.redroid_dpi=240 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_imei=${{ env.GENERATED_IMEI }} \
            androidboot.redroid_mac=${{ env.GENERATED_MAC }} \
            androidboot.redroid_serialno=${{ env.GENERATED_SERIAL }}

      - name: Wait For Redroid & Inject Fresh Android ID
        run: |
          echo "Waiting for Redroid to start..."
          sleep 15
          adb kill-server
          adb start-server
          adb connect 127.0.0.1:5555
          adb -s 127.0.0.1:5555 wait-for-device

          # Inject randomized Android ID into system settings
          adb -s 127.0.0.1:5555 shell settings put secure android_id ${{ env.GENERATED_ANDROID_ID }}

      - name: Download and Install Play Store & Browsers
        run: |
          mkdir -p /tmp/apks
          cd /tmp/apks

          # Download Play Store Client (Aurora Store) safely
          curl -sSL -o aurorastore.apk "https://files.aurorastore.org/AuroraStore/Release/AuroraStore-4.5.1.apk" || true

          if [ -f aurorastore.apk ]; then
            adb -s 127.0.0.1:5555 install -r aurorastore.apk || true
          fi

      - name: Build & Start Fast Web Screen Server
        run: |
          git clone https://github.com/NetrisTV/ws-scrcpy.git /tmp/ws-scrcpy
          cd /tmp/ws-scrcpy

          cat > Dockerfile << 'DOCKEREOF'
          FROM node:18-bullseye-slim AS builder
          RUN apt-get update && apt-get install -y python3 make g++ && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run dist

          FROM node:18-bullseye-slim
          RUN apt-get update && apt-get install -y python3 make g++ android-tools-adb && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY --from=builder /app/dist /app
          RUN npm install
          EXPOSE 8000
          CMD ["npm", "start"]
          DOCKEREOF

          docker build -t local/ws-scrcpy .

          docker run -d --name scrcpy-web \
            --restart=always \
            -p 8000:8000 \
            --net=host \
            local/ws-scrcpy

          sleep 5
          docker exec scrcpy-web adb connect 127.0.0.1:5555 || true

      - name: Start Ngrok HTTP Tunnel For Web Screen
        run: |
          ngrok http 8000 --log=stdout > ngrok_web.log &
          sleep 5

      - name: Display 1-Click Link On Summary Screen
        run: |
          WEB_TUNNEL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for t in data.get('tunnels', []):
              if t.get('proto') == 'https':
                  print(t.get('public_url'))
          ")

          echo "# 🚀 ONE-CLICK CONNECT LINK" >> $GITHUB_STEP_SUMMARY
          echo "## 👉 [$WEB_TUNNEL]($WEB_TUNNEL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🆔 Fresh Identity Applied:" >> $GITHUB_STEP_SUMMARY
          echo "- **IMEI:** \`${{ env.GENERATED_IMEI }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MAC Address:** \`${{ env.GENERATED_MAC }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Serial Number:** \`${{ env.GENERATED_SERIAL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Android ID:** \`${{ env.GENERATED_ANDROID_ID }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Keep Server Alive
        run: |
          while true; do sleep 300; done
