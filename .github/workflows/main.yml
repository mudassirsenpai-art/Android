name: Android Cloud with GApps + VNC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb curl tar wget
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Run Redroid With GApps + Native VNC (No App, No Consent Dialog)
        run: |
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            -p 5900:5900 \
            aureliolo/redroid:14.0.0_amd64_with_gapps \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=1920 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=420 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest \
            ro.setupwizard.mode=DISABLED \
            ro.rfb.port=5900

      - name: Connect ADB & Wait For Boot
        run: |
          adb kill-server
          adb start-server

          for i in $(seq 1 30); do
            if adb connect 127.0.0.1:5555 2>&1 | grep -q "connected"; then
              break
            fi
            sleep 1
          done

          adb -s 127.0.0.1:5555 wait-for-device

          for i in $(seq 1 60); do
            BOOT_COMPLETED=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Boot completed after ~${i}s."
              break
            fi
            sleep 1
          done

          adb -s 127.0.0.1:5555 shell settings put global policy_control null

          # Confirm the native VNC server is actually listening inside the container
          adb -s 127.0.0.1:5555 shell getprop ro.rfb.port || true

      - name: Start Ngrok Tunnel & Print Connection Info
        run: |
          ngrok tcp 5900 --log=stdout > ngrok_vnc.log &

          cat > /tmp/count_tunnels.py << 'PYEOF'
          import json, sys
          try:
              data = json.load(sys.stdin)
              print(len(data.get('tunnels', [])))
          except Exception:
              print(0)
          PYEOF

          cat > /tmp/get_vnc_url.py << 'PYEOF'
          import json, sys
          data = json.load(sys.stdin)
          for t in data.get('tunnels', []):
              if t.get('proto') == 'tcp':
                  print(t.get('public_url'))
          PYEOF

          for i in $(seq 1 15); do
            TUNNEL_COUNT=$(curl -s http://localhost:4040/api/tunnels | python3 /tmp/count_tunnels.py 2>/dev/null || echo 0)
            if [ "$TUNNEL_COUNT" -ge "1" ]; then
              break
            fi
            sleep 2
          done

          VNC_TUNNEL=$(curl -s http://localhost:4040/api/tunnels | python3 /tmp/get_vnc_url.py)

          echo "============================================================"
          echo "       ANDROID CLOUD (GAPPS + CHROME + PLAY STORE)          "
          echo "                  READY - CONNECT VIA VNC                   "
          echo "============================================================"
          echo ""
          echo " 1. Install 'VNC Viewer' (RealVNC) from Play Store"
          echo " 2. Add new connection using: $VNC_TUNNEL"
          echo "    (strip tcp:// prefix, use host:port only)"
          echo " 3. Connect - no password set by default."
          echo ""
          echo " This uses redroid's built-in VNC server (ro.rfb.port)."
          echo " No app install, no on-screen permission dialog needed."
          echo "============================================================"

      - name: Keep Session Active
        run: |
          while true; do sleep 300; done
