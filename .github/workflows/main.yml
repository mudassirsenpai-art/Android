name: Optimized Android Cloud Gaming Phone

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kernel Modules & Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb curl tar
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN

      - name: Run Gaming-Optimized Android OS
        run: |
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=320 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest

      - name: Start TCP Tunnel & Generate Connection Details
        run: |
          sleep 10
          # Ngrok TCP Tunnel on Android ADB Port 5555
          ngrok tcp 5555 --log=stdout > ngrok.log &
          sleep 5

          # Extract Public TCP URL
          NGROK_TCP_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*' | head -n 1)
          RDP_FORMAT_ADDRESS=$(echo $NGROK_TCP_URL | sed 's/tcp:\/\///')

          echo "============================================================"
          echo "       ANDROID GAMING CLOUD OS IS RUNNING READY            "
          echo "============================================================"
          echo " Ngrok TCP Address : $RDP_FORMAT_ADDRESS"
          echo " Username          : root (Not Required for Direct ADB)"
          echo " Password          : (No Password / Open Connection)"
          echo "============================================================"
          echo " Connect via Scrcpy / ADB: adb connect $RDP_FORMAT_ADDRESS"
          echo "============================================================"

      - name: Keep Tunnel Active
        run: |
          while true; do sleep 300; done
