name: Fast & Optimized Android Cloud (Fixed)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fast System Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends adb curl tar openssl unzip

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Generate Random Fresh Identity
        run: |
          echo "GENERATED_IMEI=$(shuf -i 860000000000000-869999999999999 -n 1)" >> $GITHUB_ENV
          echo "GENERATED_MAC=$(openssl rand -hex 6 | sed 's/\(..\)/\1:/g; s/.$//')" >> $GITHUB_ENV
          echo "GENERATED_SERIAL=$(openssl rand -hex 6 | tr 'a-z' 'A-Z')" >> $GITHUB_ENV
          echo "GENERATED_ANDROID_ID=$(openssl rand -hex 8)" >> $GITHUB_ENV

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Setup Android SDK & Emulator
        uses: android-actions/setup-android@v3

      - name: Install Emulator + System Image
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_AVD_HOME"

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64"

          # IMPORTANT: no --path here. When --path is passed explicitly,
          # avdmanager creates the phone.avd/config.ini folder but skips
          # writing the phone.ini *pointer* file in ANDROID_AVD_HOME, which
          # is the file the emulator actually uses to resolve an AVD name.
          # Letting it use the default (ANDROID_AVD_HOME) location creates
          # both files correctly.
          echo "no" | avdmanager create avd \
            -n phone -k "system-images;android-30;google_apis;x86_64" \
            --device "pixel_5" -f

          echo "--- Verifying AVD was actually created ---"
          avdmanager list avd

          if [ ! -f "$ANDROID_AVD_HOME/phone.ini" ]; then
            echo "::error::phone.ini pointer file was not created in $ANDROID_AVD_HOME — see avdmanager output above"
            ls -al "$ANDROID_AVD_HOME"
            exit 1
          fi
          if [ ! -f "$ANDROID_AVD_HOME/phone.avd/config.ini" ]; then
            echo "::error::AVD config.ini missing under $ANDROID_AVD_HOME/phone.avd"
            exit 1
          fi

          echo "AVD confirmed:"
          cat "$ANDROID_AVD_HOME/phone.ini"

      - name: Boot Emulator (headless, KVM-accelerated)
        run: |
          nohup $ANDROID_HOME/emulator/emulator -avd phone \
            -no-window -no-audio -no-boot-anim -accel on -gpu swiftshader_indirect \
            > emulator.log 2>&1 &
          echo "Emulator launched, waiting for adb device..."

      - name: Wait For Full System Boot & Inject Identity
        run: |
          adb kill-server
          adb start-server

          echo "Waiting for emulator to register with adb..."
          timeout 90 adb wait-for-device || {
            echo "::error::adb never saw the emulator device (it likely crashed on launch)"
            echo "--- emulator.log ---"
            cat emulator.log
            echo "--- adb devices ---"
            adb devices -l
            exit 1
          }

          echo "adb sees the device. Checking process is actually alive..."
          adb devices -l
          if ! pgrep -f "emulator64-x86_64|qemu-system" > /dev/null; then
            echo "::error::Emulator process is not running anymore"
            cat emulator.log
            exit 1
          fi

          echo "Waiting for Android Package Manager service..."
          timeout=300
          elapsed=0
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            sleep 5
            elapsed=$((elapsed + 5))
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "::error::Android did not finish booting within ${timeout}s"
              cat emulator.log
              exit 1
            fi
          done
          echo "Android System Ready!"

          adb shell settings put secure android_id ${{ env.GENERATED_ANDROID_ID }}

      - name: Install Aurora Play Store (Guaranteed Fix)
        run: |
          mkdir -p /tmp/apks && cd /tmp/apks

          # files.aurorastore.org no longer resolves - project's releases now
          # live on auroraoss.com. Try that first, then fall back to
          # F-Droid's mirror if the primary host is ever unreachable, so a
          # single dead domain doesn't fail the whole job again.
          set -e
          URLS=(
            "https://auroraoss.com/files/AuroraStore/Release/AuroraStore-4.8.4.apk"
            "https://f-droid.org/repo/com.aurora.store_59.apk"
          )

          DOWNLOADED=""
          for url in "${URLS[@]}"; do
            echo "Trying: $url"
            if curl -sSL -f -o aurora.apk "$url"; then
              DOWNLOADED="$url"
              break
            fi
            echo "Failed: $url"
          done

          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download Aurora Store APK from any known source"
            exit 1
          fi

          echo "Downloaded from $DOWNLOADED"
          adb install -r -g aurora.apk

      - name: Run Ultra-Fast Scrcpy Web Server (Pre-built Image)
        run: |
          git clone https://github.com/NetrisTV/ws-scrcpy.git /tmp/ws-scrcpy
          cd /tmp/ws-scrcpy

          cat > Dockerfile << 'DOCKEREOF'
          FROM node:18-bullseye-slim
          # python3/make/g++ are required by node-gyp to compile native
          # modules (e.g. node-pty) pulled in by ws-scrcpy's dependencies.
          # Without them, "npm ci" fails with "Could not find any Python
          # installation to use".
          RUN apt-get update && apt-get install -y --no-install-recommends \
              android-tools-adb python3 make g++ \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production
          COPY . .
          EXPOSE 8000
          CMD ["npm", "start"]
          DOCKEREOF

          docker build -t local/ws-scrcpy .
          docker run -d --name scrcpy-web --restart=always -p 8000:8000 --net=host local/ws-scrcpy

          echo "Waiting for ws-scrcpy server to be ready..."
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000 > /dev/null; then
              echo "ws-scrcpy is up."
              break
            fi
            sleep 2
          done

          docker exec scrcpy-web adb connect 127.0.0.1:5555 || true

      - name: Start Ngrok & Show Summary Link
        run: |
          ngrok http 8000 --log=stdout > ngrok_web.log &

          WEB_TUNNEL=""
          for i in $(seq 1 15); do
            WEB_TUNNEL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "
          import json,sys
          try:
              data = json.load(sys.stdin)
              for t in data.get('tunnels', []):
                  if t.get('proto') == 'https':
                      print(t.get('public_url'))
          except Exception:
              pass
          ")
            if [ -n "$WEB_TUNNEL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$WEB_TUNNEL" ]; then
            echo "::error::Ngrok tunnel URL never became available"
            cat ngrok_web.log
            exit 1
          fi

          echo "# 🚀 FAST ONE-CLICK CONNECT LINK" >> $GITHUB_STEP_SUMMARY
          echo "## 👉 [$WEB_TUNNEL]($WEB_TUNNEL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🆔 Fresh Identity Applied:" >> $GITHUB_STEP_SUMMARY
          echo "- **IMEI:** \`${{ env.GENERATED_IMEI }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MAC Address:** \`${{ env.GENERATED_MAC }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Serial:** \`${{ env.GENERATED_SERIAL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Android ID:** \`${{ env.GENERATED_ANDROID_ID }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
