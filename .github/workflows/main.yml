name: Optimized Android Cloud Gaming Phone

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kernel Modules & ADB
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb curl tar
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN

      - name: Run Gaming-Optimized Redroid Container
        run: |
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=320 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest

      - name: Wait For Redroid To Boot
        run: |
          echo "Waiting for redroid container to fully boot..."
          sleep 20
          docker logs redroid --tail 50 || true

      - name: Connect ADB (Local Sanity Check)
        run: |
          adb kill-server
          adb start-server
          adb connect 127.0.0.1:5555
          adb -s 127.0.0.1:5555 wait-for-device
          adb -s 127.0.0.1:5555 shell settings put global policy_control null
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.release || true
          echo "Local ADB connection to redroid confirmed."

      - name: Build & Start Web Screen Server (Browser Fallback)
        run: |
          git clone https://github.com/NetrisTV/ws-scrcpy.git /tmp/ws-scrcpy
          cd /tmp/ws-scrcpy

          cat > Dockerfile << 'DOCKEREOF'
          FROM node:18-bullseye-slim AS builder
          RUN apt-get update && apt-get install -y python3 make g++ && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run dist

          FROM node:18-bullseye-slim
          RUN apt-get update && apt-get install -y python3 make g++ android-tools-adb && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY --from=builder /app/dist /app
          RUN npm install
          EXPOSE 8000
          CMD ["npm", "start"]
          DOCKEREOF

          docker build -t local/ws-scrcpy .

          docker run -d --name scrcpy-web \
            --restart=always \
            -p 8000:8000 \
            --net=host \
            local/ws-scrcpy

          sleep 5
          docker exec scrcpy-web adb connect 127.0.0.1:5555 || true

      - name: Start Ngrok TCP Tunnel For ADB (Phone Connect)
        run: |
          # This exposes port 5555 (ADB) over a public TCP address,
          # so you can adb connect from YOUR OWN PHONE (via Termux/ADB app)
          ngrok tcp 5555 --log=stdout > ngrok_adb.log &
          sleep 5

      - name: Start Ngrok HTTP Tunnel For Web Screen
        run: |
          ngrok http 8000 --log=stdout > ngrok_web.log &
          sleep 5

      - name: Print Connection Info
        run: |
          ADB_TUNNEL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for t in data.get('tunnels', []):
              if t.get('proto') == 'tcp':
                  print(t.get('public_url'))
          ")

          WEB_TUNNEL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for t in data.get('tunnels', []):
              if t.get('proto') == 'https':
                  print(t.get('public_url'))
          ")

          echo "============================================================"
          echo "        GAMING ANDROID CLOUD - READY TO CONNECT              "
          echo "============================================================"
          echo ""
          echo " OPTION 1: Connect from YOUR OWN PHONE (ADB)"
          echo "   1. Install 'Termux' or any ADB client app on your phone"
          echo "   2. Run: adb connect <HOST>:<PORT>   (see below)"
          echo "   ADB TUNNEL   : $ADB_TUNNEL"
          echo ""
          echo " OPTION 2: Connect from phone BROWSER (no app needed)"
          echo "   WEB SCREEN   : $WEB_TUNNEL"
          echo ""
          echo "============================================================"
          echo " NOTE: ngrok free tier TCP address changes every run."
          echo " Copy the ADB TUNNEL line exactly as shown above."
          echo "============================================================"

      - name: Keep Tunnel Active
        run: |
          while true; do sleep 300; done
