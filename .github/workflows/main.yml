name: Cloud Gaming Android Phone

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-gaming-phone:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Setup Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          .\ngrok.exe authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Start High-Performance Gaming Android Container
        run: |
          docker run -d --name android-gaming-container \
            -p 6080:6080 \
            -p 5555:5555 \
            --privileged \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            budtmo/docker-android:emulator_11.0

      - name: Start Ngrok Tunnel & Show Direct Screen Link
        run: |
          # Start ngrok tunnel for port 6080 (Web VNC Screen)
          Start-Process -NoNewWindow -FilePath ".\ngrok.exe" -ArgumentList "http 6080"
          Start-Sleep -Seconds 10

          $tunnelStatus = Invoke-RestMethod http://localhost:4040/api/tunnels
          $ngrokUrl = $tunnelStatus.tunnels | Where-Object { $_.proto -eq "https" } | Select-Object -ExpandProperty public_url

          Write-Host "============================================================"
          Write-Host "         GAMING ANDROID PHONE IS READY!                     "
          Write-Host "============================================================"
          Write-Host " DIRECT PHONE SCREEN LINK : $ngrokUrl/vnc.html"
          Write-Host "============================================================"

      - name: Keep Tunnel Alive
        run: |
          while ($true) { Start-Sleep -Seconds 300 }
