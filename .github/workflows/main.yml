name: Android OS Remote Access

on:
  workflow_dispatch:

jobs:
  run-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo adduser $USER kvm
          sudo chown $USER /dev/kvm

      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN

      - name: Launch Android OS (Docker Container)
        run: |
          docker run -d \
            --privileged \
            --name android-container \
            -p 6080:6080 \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            --device /dev/kvm \
            budtmo/docker-android:latest

      - name: Wait for Android OS to Boot Up
        run: |
          echo "Waiting for Android Emulator to start..."
          sleep 90

      - name: Start Ngrok Tunnel
        run: |
          echo "Creating Ngrok Tunnel..."
          ngrok http 6080 --log=stdout > ngrok.log &
          sleep 5
          echo "=========================================="
          echo "YOUR NGROK URL:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'https://[^"]*' | head -n 1
          echo "=========================================="

      - name: Keep Workflow Alive
        run: |
          echo "Android OS running! Access using the Ngrok link above."
          sleep 21600
