name: RDP Supported Android Cloud OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RDP & Desktop Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y xrdp lxde adb curl tar
          sudo systemctl enable xrdp
          echo "exec startlxde" > ~/.xsession
          sudo service xrdp restart
          
          # Set Password for RDP User
          echo "runneradmin:P@ssw0rd!" | sudo chpasswd

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN

      - name: Start Redroid Android OS
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=320 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest

      - name: Start Ngrok RDP Tunnel & Print Info
        run: |
          sleep 10
          # Expose RDP Port 3389
          ngrok tcp 3389 --log=stdout > ngrok.log &
          sleep 5

          NGROK_TCP_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*' | head -n 1)
          RDP_ADDRESS=$(echo $NGROK_TCP_URL | sed 's/tcp:\/\///')

          echo "==============================================="
          echo "       ANDROID RDP CONNECT DETAILS             "
          echo "==============================================="
          echo " RDP Address : $RDP_ADDRESS"
          echo " Username    : runneradmin"
          echo " Password    : P@ssw0rd!"
          echo "==============================================="

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
