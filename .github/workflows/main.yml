name: Optimized Android Cloud Gaming Phone

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-android-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kernel Modules & Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb curl tar
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

      - name: Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/

      - name: Authenticate Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN

      - name: Run Gaming-Optimized Android OS (Redroid ARM64 Support)
        run: |
          docker run -d --name redroid --privileged \
            --pull always \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_fps=60 \
            androidboot.redroid_dpi=320 \
            androidboot.hardware=redroid \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_gpu_node=/dev/dri/renderD128

      - name: Launch WebRTC Visual Touch Screen Server
        run: |
          docker run -d --name ws-scrcpy \
            --net=host \
            -e ADB_SERVER_SOCKET=tcp:localhost:5555 \
            netbeast/ws-scrcpy || true

      - name: Connect ADB & Start Tunnel
        run: |
          sleep 12
          adb connect 127.0.0.1:5555 || true
          
          # Force Navigation Bar Visibility
          adb shell settings put global policy_control null
          
          ngrok http 8000 --log=stdout > ngrok.log &
          sleep 5

          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'https://[^"]*' | head -n 1)
          
          echo "============================================================"
          echo "       GAMING-OPTIMIZED ANDROID IS LIVE                      "
          echo "============================================================"
          echo " Direct Screen URL : $NGROK_URL"
          echo "============================================================"

      - name: Keep Tunnel Active
        run: |
          while true; do sleep 300; done
